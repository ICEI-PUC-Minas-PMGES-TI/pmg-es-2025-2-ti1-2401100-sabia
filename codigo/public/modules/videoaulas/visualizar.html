<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videoaula - Sabiaa</title>
    <link rel="stylesheet" href="stylevideoaula.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <aside class="sidebar-left">
        <div class="logo">
            <img src="/codigo/public/modules/imagens/Logo Sabiaa.png" alt="Logo Sabiaa">
            <span>SABIAA</span>
        </div>
        <nav class="menu-principal">
            <a href="#" class="menu-item"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="#" class="menu-item"><i class="fa-solid fa-house"></i></a>
            <a href="#" class="menu-item active"><i class="fa-solid fa-layer-group"></i></a>
            <a href="#" class="menu-item"><i class="fa-solid fa-chart-line"></i></a>
        </nav>
    </aside>

    <header class="top-header">
        <div class="user-menu">
            <a href="#"><i class="fa-regular fa-bell"></i></a>
            <a href="#"><i class="fa-regular fa-user-circle"></i></a>
            <a href="#"><i class="fa-solid fa-gear"></i></a>
        </div>
    </header>

    <main class="main-content">
        
        <div class="video-player-container">
            <iframe 
                id="video-player"
                width="560" 
                height="315" 
                src="" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
            </iframe>
        </div>
        <section class="course-info-card">
            <div class="course-header">
                <div>
                    <h1 id="course-title">Carregando...</h1>
                    <div id="course-meta">
                        <span><i class="fa-regular fa-calendar"></i> Carregando...</span>
                    </div>
                </div>
            </div>
            <button class="favorite-btn" id="favorite-btn">
                <i class="fa-regular fa-heart"></i> Favoritar
            </button>
            <div class="course-description">
                <h2>Descrição</h2>
                <p id="course-description">Carregando...</p>
            </div>
        </section>
    </main>

    <aside class="sidebar-right">
        <section class="related-videos-card">
            <h2>Vídeos Relacionados</h2>
            <ul class="video-list" id="related-videos-list">
                <li class="video-item">Carregando vídeos...</li>
            </ul>
    </aside>
    
    <footer class="main-footer">
        <div class="footer-content">
            <div class="footer-section about">
                <div class="logo">
                    <img src="/codigo/public/modules/imagens/Logo Sabiaa 2.png" alt="Logo Sabiaa">
                </div>
                <p>Educação e tecnologia alinhadas para um futuro melhor</p>
            </div>
            <div class="footer-section links">
                <h3>Links Rápidos</h3>
                <ul>
                    <li><a href="#">Sobre</a></li>
                    <li><a href="#">Cursos</a></li>
                    <li><a href="#">Suporte</a></li>
                </ul>
            </div>
            <div class="footer-section contact">
                <h3>Contato</h3>
                <p><i class="fa-regular fa-envelope"></i> contato@sabiaa.com.br</p>
                <p><i class="fa-solid fa-phone"></i> (31) 1234-5678</p>
            </div>
            <div class="footer-section social">
                <h3>Redes Sociais</h3>
                <div class="social-icons">
                    <a href="#"><i class="fab fa-facebook-f"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-youtube"></i></a>
                </div>
            </div>
        </div>
    </footer>
</script>
<script src="script.js"></script>
</body>
</html>
