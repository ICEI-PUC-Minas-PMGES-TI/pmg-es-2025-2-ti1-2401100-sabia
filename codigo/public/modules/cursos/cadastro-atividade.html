<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabiaa - Cadastrar Atividade</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="/codigo/public/assets/css/global.css">
    
    <link rel="stylesheet" href="/codigo/public/modules/cursos/cadastro-atividade.css">
</head>
<body>
    <div class="page-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="/codigo/public/assets/images/logos/logo_bege_texto_lateral.png" alt="Sabiaa" class="logo"> 
            </div>
            <nav class="sidebar-nav">
                <a href="#"><i class="fa-solid fa-home"></i> Início</a>
                <a href="#"><i class="fa-solid fa-book"></i> Cursos</a>
                <a href="/codigo/public/modules/cursos/cadastro-atividade.html" class="active"><i class="fa-solid fa-calendar-plus"></i> Cadastrar Atividade</a>
                <a href="#"><i class="fa-solid fa-user"></i> Perfil</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="search-bar">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Buscar...">
                </div>
                <div class="user-menu">
                    <i class="fa-solid fa-bell"></i>
                    <i class="fa-solid fa-cog"></i>
                    <img src="/codigo/public/assets/images/default-aluno-avatar.svg" alt="Usuário" class="avatar"> 
                </div>
            </header>

            <section class="content-body">
                
                <div class="form-wrapper">
                    <div class="form-header-text">
                        <h1>Cadastrar Nova Atividade</h1>
                        <p>Crie e gerencie atividades para seus alunos</p>
                    </div>

                    <form id="form-atividade" class="card">
                        <div class="form-header">
                            <h2>Informações da Atividade</h2>
                            <div class="form-group-inline">
                                <label for="turma">Turma:</label>
                                <select id="turma" name="turma" class="form-control">
                                    <option value="mat-9b">Matemática 9º B</option>
                                    <option value="por-8a">Português 8º A</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="titulo">Título da Atividade</label>
                            <input type="text" id="titulo" name="titulo" class="form-control" placeholder="Digite o título da atividade" required>
                        </div>

                        <div class="form-group">
                            <label for="descricao">Descrição Detalhada</label>
                            <textarea id="descricao" name="descricao" rows="4" class="form-control" placeholder="Descreva os objetivos e instruções da atividade"></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="tipo">Tipo de Atividade</label>
                                <select id="tipo" name="tipo" class="form-control" required>
                                    <option value="" disabled selected>Selecione o tipo</option>
                                    <option value="exercicio">Exercício</option>
                                    <option value="quiz">Quiz</option>
                                    <option value="trabalho">Trabalho</option>
                                    <option value="projeto">Projeto</option>
                                    <option value="leitura">Leitura</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="prazo">Prazo de Entrega</label>
                                <input type="datetime-local" id="prazo" name="prazo" class="form-control" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="anexos">Anexos</label>
                            <div class="upload-area" id="upload-area">
                                <i class="fa-solid fa-upload"></i>
                                <p>Arraste arquivos aqui ou clique para selecionar</p>
                                <input type="file" id="anexos" name="anexos" multiple hidden>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn-cancelar">Cancelar</button>
                            <button type="submit" class="btn-principal">Salvar Atividade</button>
                        </div>
                    </form>
                </div>

                <aside class="sidebar-right">
                    <h3>Atividades Recentes</h3>
                    
                    <div id="lista-atividades-recentes">
                        </div>

                </aside>
            </section>
        </main>
    </div>

    <script src="/codigo/public/modules/cursos/cadastro-atividade.js"></script>
    <script src="/codigo/public/shared/layout/layout.js"></script>
    <script src="/codigo/public/shared/layout/normalize-modules.js"></script>
</body>
</html>
