<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Cursos - Sabiaa</title>
    <link rel="stylesheet" href="/codigo/public/assets/css/global.css">
    <link rel="stylesheet" href="/codigo/public/assets/css/interno.css">
    <link rel="stylesheet" href="/codigo/public/shared/components/components.css">
    <link rel="stylesheet" href="/codigo/public/modules/cursos/PainelCursos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <div class="sidebar-overlay"></div>
    <div class="dashboard-container">
    <!-- Shared sidebar -->


    <div class="main-wrapper">

        <main class="content-area">
        <section class="filter-bar">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" placeholder="Buscar por título..." id="search-input">
            </div>
            
            <select name="disciplinas" id="select-disciplina">
                <option value="">Todas as disciplinas</option>
                </select>

            <button class="btn-filter" id="filterButton">
                <i class="fa-solid fa-filter"></i>
                Filtrar
            </button>
        </section>

        <section class="courses-container">
            <div class="courses-header">
                <span id="course-count">0 cursos encontrados</span>
                <div id="admin-controls" style="margin-left:12px"></div>
                <!-- view toggles removed: single unified layout -->
            </div>

            <div class="course-grid" id="course-grid">
                </div>

        </section>

        <footer class="main-footer">
        </footer>
        </main>
    </div>
    </div>

    <script src="/codigo/public/modules/cursos/PainelCursos.js"></script>
    <script src="/codigo/public/shared/layout/layout.js"></script>
    <script src="/codigo/public/shared/layout/normalize-modules.js"></script>
</body>
</html>
