<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SABIAA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/codigo/public/assets/css/global.css">
    <link rel="stylesheet" href="/codigo/public/assets/css/interno.css">
    <link rel="stylesheet" href="/codigo/public/shared/components/components.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar-overlay"></div>

    <div class="dashboard-container">

        <main class="content-area">
            <div class="container-geral">
                <header class="cabecalho">
                    <h1>Bem-vinda de volta, <span id="dashUserName">...</span>!</h1>
                    <p>Continue sua jornada de aprendizado</p>
                </header>

                <div class="conteudo-principal">
                    <section class="coluna-esquerda">
                        <div class="caixa card-um">
                            <h2>Resumo do Progresso</h2>
                            <div class="grid-resumo">
                                <div class="item-resumo" style="grid-row: span 2">
                                    <h3>Evolução Mensal</h3>
                                    <div class="grafico-placeholder"><!-- chart injected by JS --></div>
                                </div>
                                <div class="item-resumo cursos-feitos">
                                    <h3>Cursos Concluídos</h3>
                                    <div class="info-icone">
                                        <span class="numero" id="dashCursosConcluidos">0</span>
                                        <span class="icone"><i class="fas fa-graduation-cap"></i></span>
                                    </div>
                                </div>
                                <div class="item-resumo horas-estudo">
                                    <h3>Horas Estudadas</h3>
                                    <div class="info-icone">
                                        <span class="numero" id="dashHorasEstudo">0h</span>
                                        <span class="icone"><i class="fas fa-clock"></i></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="caixa card-dois">
                            <div class="caixa-header">
                                <h2>Minhas Tarefas</h2>
                                <span class="contador" id="dashTasksCount">0 pendentes</span>
                            </div>
                            <ul id="dashTasksList"></ul>
                        </div>

                        <div class="caixa card-tres">
                            <h2>Continuar Assistindo</h2>
                            <div class="video-bloco">
                                <div class="video-thumb"><span class="icone-play"><i class="fas fa-play"></i></span></div>
                                <div class="video-info">
                                    <h3 id="dashVideoTitle">—</h3>
                                    <p id="dashVideoSubtitle">—</p>
                                    <div class="progresso-wrapper">
                                        <div class="barra-progresso"><div class="progresso" id="dashVideoProgress" style="width:0%;"></div></div>
                                        <span class="porcentagem" id="dashVideoPercent">0%</span>
                                    </div>
                                </div>
                                <button class="botao-video" id="dashBtnVideo">Continuar</button>
                            </div>
                        </div>
                    </section>

                    <section class="coluna-direita">
                        <div class="caixa card-quatro">
                            <h2>Favoritos</h2>
                            <ul id="dashFavorites"></ul>
                        </div>

                        <div class="caixa card-cinco">
                            <h2>Recomendações <span class="icone-info-header"><i class="fas fa-star"></i></span></h2>
                            <div id="dashRecommendations"></div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script src="/codigo/public/assets/js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/codigo/public/shared/layout/layout.js"></script>
    <script src="/codigo/public/shared/layout/normalize-modules.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
