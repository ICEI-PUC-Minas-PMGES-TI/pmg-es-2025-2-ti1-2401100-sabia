<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Certificado - SABIAA</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/937e8004d1.js" crossorigin="anonymous"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            font-family: 'Outfit', sans-serif;
        }

        .validation-container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .validation-form {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-validate {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-validate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-validate:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .result-container {
            display: none;
            margin-top: 30px;
        }

        .result-success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 1px solid #c3e6cb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            border: 1px solid #f5c6cb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .result-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .result-success .result-icon {
            color: #155724;
        }

        .result-error .result-icon {
            color: #721c24;
        }

        .result-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .result-success .result-title {
            color: #155724;
        }

        .result-error .result-title {
            color: #721c24;
        }

        .certificate-info {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .info-label {
            font-weight: 500;
            color: #666;
        }

        .info-value {
            font-weight: 600;
            color: #333;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }

        .loading {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-new-validation {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-new-validation:hover {
            background: #667eea;
            color: white;
        }

        .home-link {
            display: inline-block;
            margin-top: 30px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .home-link:hover {
            color: #764ba2;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .validation-container {
                padding: 30px 20px;
                margin: 10px;
            }

            .info-row {
                flex-direction: column;
                gap: 5px;
            }

            .info-value {
                max-width: 100%;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="validation-container">
        <div class="logo"><img src="../assets/images/logos/icon.png" alt=""></div>
        <h1>🔍 Validar Certificado</h1>
        <p class="subtitle">Digite o token de validação para verificar a autenticidade do certificado</p>

        <form class="validation-form" onsubmit="validarCertificado(event)">
            <div class="input-group">
                <label for="token">Token de Validação:</label>
                <input 
                    type="text" 
                    id="token" 
                    name="token" 
                    placeholder="Digite o token do certificado..."
                    required
                    autocomplete="off"
                >
            </div>
            
            <button type="submit" class="btn-validate" id="validateBtn">
                <span class="loading" id="loadingSpinner">
                    <div class="spinner"></div>
                    Validando...
                </span>
                <span id="validateText">
                    <i class="fas fa-search"></i>
                    Validar Certificado
                </span>
            </button>
        </form>

        <div class="result-container" id="resultContainer">
            <!-- Resultado será inserido aqui -->
        </div>

        <a href="index.html" class="home-link">
            <i class="fas fa-home"></i>
            Voltar ao início
        </a>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000';

        async function validarCertificado(event) {
            event.preventDefault();
            
            const token = document.getElementById('token').value.trim();
            const validateBtn = document.getElementById('validateBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const validateText = document.getElementById('validateText');
            const resultContainer = document.getElementById('resultContainer');
            
            if (!token) {
                mostrarErro('Por favor, digite um token de validação.');
                return;
            }

            // Mostrar loading
            validateBtn.disabled = true;
            loadingSpinner.style.display = 'flex';
            validateText.style.display = 'none';
            resultContainer.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE_URL}/api/certificados/validar/${encodeURIComponent(token)}`);
                const data = await response.json();

                if (response.ok && data.valido) {
                    mostrarSucesso(data.certificado);
                } else {
                    mostrarErro(data.error || 'Token inválido ou certificado não encontrado.');
                }
            } catch (error) {
                console.error('Erro na validação:', error);
                mostrarErro('Erro ao validar certificado. Verifique sua conexão e tente novamente.');
            } finally {
                // Ocultar loading
                validateBtn.disabled = false;
                loadingSpinner.style.display = 'none';
                validateText.style.display = 'flex';
            }
        }

        function mostrarSucesso(certificado) {
            const resultContainer = document.getElementById('resultContainer');
            
            const dataEmissao = new Date(certificado.data_emissao).toLocaleDateString('pt-BR');
            const dataConclusao = new Date(certificado.data_conclusao).toLocaleDateString('pt-BR');
            
            resultContainer.innerHTML = `
                <div class="result-success">
                    <div class="result-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="result-title">✅ Certificado Válido!</div>
                    <p>Este certificado foi emitido pela plataforma SABIAA e é autêntico.</p>
                    
                    <div class="certificate-info">
                        <div class="info-row">
                            <span class="info-label">Aluno:</span>
                            <span class="info-value">${certificado.usuario_nome}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Curso:</span>
                            <span class="info-value">${certificado.curso_titulo}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Instrutor:</span>
                            <span class="info-value">${certificado.instrutor}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Categoria:</span>
                            <span class="info-value">${certificado.categoria}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Carga Horária:</span>
                            <span class="info-value">${certificado.carga_horaria} horas</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Nota Final:</span>
                            <span class="info-value">${certificado.nota_final.toFixed(1)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Data de Conclusão:</span>
                            <span class="info-value">${dataConclusao}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Data de Emissão:</span>
                            <span class="info-value">${dataEmissao}</span>
                        </div>
                    </div>
                    
                    <button class="btn-new-validation" onclick="novaValidacao()">
                        <i class="fas fa-redo"></i>
                        Validar Outro Certificado
                    </button>
                </div>
            `;
            
            resultContainer.style.display = 'block';
        }

        function mostrarErro(mensagem) {
            const resultContainer = document.getElementById('resultContainer');
            
            resultContainer.innerHTML = `
                <div class="result-error">
                    <div class="result-icon">
                        <i class="fas fa-times-circle"></i>
                    </div>
                    <div class="result-title">❌ Certificado Inválido</div>
                    <p>${mensagem}</p>
                    
                    <button class="btn-new-validation" onclick="novaValidacao()">
                        <i class="fas fa-redo"></i>
                        Tentar Novamente
                    </button>
                </div>
            `;
            
            resultContainer.style.display = 'block';
        }

        function novaValidacao() {
            document.getElementById('token').value = '';
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('token').focus();
        }

        // Auto-focus no campo de token
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('token').focus();
        });

        // Permitir colar token e validar automaticamente
        document.getElementById('token').addEventListener('paste', function(e) {
            setTimeout(() => {
                const token = e.target.value.trim();
                if (token.length > 20) { // Assumindo que tokens são longos
                    document.querySelector('.validation-form').dispatchEvent(new Event('submit'));
                }
            }, 100);
        });
    </script>
    <script src="/codigo/public/shared/layout/layout.js"></script>
</body>
</html>
