<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABIAA - Redirecionando...</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #4b3c5d 0%, #e7bfa5 100%);
            color: white;
        }
        .redirect-container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .logo {
            font-size: 3em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #fff1ce;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff1ce;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            margin: 10px 0;
            opacity: 0.9;
        }
        .manual-link {
            margin-top: 20px;
        }
        .manual-link a {
            color: #fff1ce;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border: 2px solid #fff1ce;
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        .manual-link a:hover {
            background-color: #fff1ce;
            color: #4b3c5d;
        }
    </style>
</head>
<body>
    <!-- 
    ⚠️ REDIRECIONAMENTO TEMPORÁRIO ⚠️
    
    Este arquivo index.html está configurado para redirecionar automaticamente 
    para a nova homepage do SABIAA localizada em gustavo/estatico/homepage.html
    
    Este redirecionamento é TEMPORÁRIO até que todas as páginas sejam integradas
    em uma estrutura definitiva do projeto.
    
    -->
    
    <div class="redirect-container">
        <div class="logo">SABIAA</div>
        <div class="spinner"></div>
        <p>Redirecionando para a homepage...</p>
        <p><small>Aguarde alguns segundos</small></p>
        
        <div class="manual-link">
            <a href="gustavo/estatico/homepage.html">Clique aqui se não for redirecionado</a>
        </div>
    </div>

    <script>
        setTimeout(function() {
            window.location.href = 'gustavo/estatico/homepage.html';
        }, 1000);
        

        window.addEventListener('load', function() {
            setTimeout(function() {
                if (window.location.pathname.includes('index.html') || window.location.pathname === '/') {
                    window.location.replace('gustavo/estatico/homepage.html');
                }
            }, 3000);
        });
    </script>
</body>
</html>
